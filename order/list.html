<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>订单列表 · ALBB 客户下单系统</title>
  <link rel="stylesheet" href="css/style.css?v=1005" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar" id="topbar"></div>
      <div class="content">
        <div class="tabs" id="tabs"></div>
        <div class="filters">
          <input type="date" id="fFrom" title="入库日期从" />
          <span style="color: #9ca3af">to</span>
          <input type="date" id="fTo" title="入库日期至" />
          <select id="fStatus">
            <option value="">订单状态</option>
            <option>待入仓</option><option>已入库</option><option>已出仓</option>
            <option>已发出</option><option>运输中</option><option>已到港</option>
            <option>清关中</option><option>派送中</option><option>派送完成</option>
            <option>签收</option><option>客户已接收</option>
          </select>
          <input id="fKeyword" placeholder="订单号 / 唛头 / 物流单号" style="width: 190px" />
          <button class="btn sm" onclick="loadOrders()">🔍 搜索</button>
          <button class="btn sm orange" onclick="location.href='index.html'">＋ 新建订单</button>
        </div>

        <div class="card table-wrap" style="padding: 8px 0 0">
          <table class="grid" id="tbl">
            <thead>
              <tr>
                <th>#</th><th>入库日期</th><th>订单号</th><th>唛头</th><th>仓库类型</th>
                <th>箱数</th><th>重量(KG)</th><th>计费重</th><th>计费体积</th>
                <th>单价</th><th>最新动态</th><th>时间</th><th>预计出仓</th>
                <th>签收时间</th><th>备注</th><th>物流单号</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
          <div class="empty-tip" id="empty" style="display: none">暂无订单，点击右上角「＋ 新建订单」开始下单</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 订单详情弹窗 -->
  <div class="modal-mask" id="detailMask" style="display: none">
    <div class="modal" id="detailBox"></div>
  </div>

  <script src="js/config.js?v=1005"></script>
  <script src="js/common.js?v=1005"></script>
  <script>
    renderShell("", "订单列表");

    // 频道标签
    const params = new URLSearchParams(location.search);
    let curChannel = params.get("channel") || "";
    const tabsEl = document.getElementById("tabs");
    tabsEl.innerHTML =
      `<a class="tab${!curChannel ? " active" : ""}" href="list.html">全部</a>` +
      CHANNELS.map(
        (c) => `<a class="tab${curChannel === c.key ? " active" : ""}" href="list.html?channel=${c.key}">${c.name}</a>`
      ).join("");

    function statusPill(s) {
      return `<span class="status-pill s-${esc(s)}">${esc(s || "-")}</span>`;
    }

    let fullOrders = {}; // id → 订单对象（列表行打印唛头用）

    // ---- 最新动态 与实际运踪同步：抓取运踪接口，按关键词映射成简短状态 ----
    const TRACK_RULES = [
      [/签收|派送完成|客户已接收|deliver(ed)?|signed|pod\b/i, "签收", "s-派送完成"],
      [/派送中|out for delivery|on delivery|delivering/i, "派送中", "s-派送中"],
      [/清关|customs/i, "清关中", "s-已出仓"],
      [/到达|抵达|arrival|arrived/i, "已到港", "s-已出仓"],
      [/起飞|飞行|航班|运输|在途|中转|flight|in flight|transit|departed|airline|vessel|shipping/i, "运输中", "s-已出仓"],
      [/出口|export|离港|起飞前|terminal|iata/i, "已发出", "s-已出仓"],
      [/入库|入仓|收货|warehouse|received|inbound/i, "已入库", "s-已入库"],
    ];
    function mapTrackStatus(text) {
      if (!text) return null;
      for (const [re, label, cls] of TRACK_RULES) {
        if (re.test(text)) return { label, cls };
      }
      return null;
    }
    /** 逐单拉取真实运踪，把「最新动态」列替换为实际进度关键词 */
    async function syncStatusFromTracking(orders) {
      const targets = orders.filter((o) => o.trackingNo).slice(0, 30);
      for (const o of targets) {
        const cell = document.getElementById("dyn_" + o.id);
        if (!cell) continue;
        try {
          const resp = await fetch(`${CFG.TRACK_API}/?source=auto&trackingNo=${encodeURIComponent(o.trackingNo)}`);
          const data = await resp.json();
          const latestText = [data.currentActivity, (data.tracks || [])[0] && (data.tracks[0].status + " " + (data.tracks[0].statusEn || ""))]
            .filter(Boolean)
            .join(" ");
          const mapped = mapTrackStatus(latestText);
          if (mapped) {
            cell.innerHTML = `<span class="status-pill ${mapped.cls}">${mapped.label}</span>`;
          }
        } catch (e) {
          /* 单个查询失败不打断其他单 */
        }
      }
    }

    async function loadOrders() {
      const tbody = document.getElementById("tbody");
      tbody.innerHTML = '<tr><td colspan="16" style="text-align:center;color:#6b7280;padding:30px">加载中…</td></tr>';
      const qs = new URLSearchParams();
      if (curChannel) qs.set("channel", curChannel);
      try {
        const data = await api("/api/orders?" + qs.toString());
        let orders = data.orders || [];
        const from = document.getElementById("fFrom").value;
        const to = document.getElementById("fTo").value;
        const st = document.getElementById("fStatus").value;
        const kw = document.getElementById("fKeyword").value.trim().toUpperCase();
        if (from) orders = orders.filter((o) => o.createdAt >= from);
        if (to) orders = orders.filter((o) => o.createdAt <= to);
        if (st) orders = orders.filter((o) => o.status === st);
        if (kw)
          orders = orders.filter(
            (o) =>
              (o.orderNo || "").toUpperCase().includes(kw) ||
              (o.markingNo || "").toUpperCase().includes(kw) ||
              (o.trackingNo || "").toUpperCase().includes(kw)
          );
        document.getElementById("empty").style.display = orders.length ? "none" : "block";
        const hl = params.get("highlight");
        fullOrders = {};
        orders.forEach((o) => (fullOrders[o.id] = o));
        tbody.innerHTML = orders
          .map(
            (o, i) => `<tr${hl === o.id ? ' style="background:#fff7e0"' : ""}>
              <td>${i + 1}</td>
              <td>${esc(o.createdAt)}</td>
              <td><b style="color:#2e7d32">${esc(o.orderNo || o.asn || "-")}</b></td>
              <td>${esc(o.markingNo || "-")}</td>
              <td>${esc(o.warehouse)}</td>
              <td>${esc(o.pieces)}</td>
              <td>${esc(o.weightKg || "-")}</td>
              <td>${o.chargeWeight ? `<span class="badge">${esc(fmtPrice(o.chargeWeight))}</span>` : "-"}</td>
              <td>${o.chargeVolume ? `<span class="badge">${esc(fmtPrice(o.chargeVolume))}</span>` : "-"}</td>
              <td>${o.unitPrice ? `<span class="badge">￥${esc(fmtPrice(o.unitPrice))}</span>` : "-"}</td>
              <td id="dyn_${o.id}" style="cursor:${o.trackingNo ? "pointer" : "default"}" title="${o.trackingNo ? "点击查看运踪" : ""}">${statusPill(o.status)}</td>
              <td>${esc(o.statusTime || "-")}</td>
              <td>${esc(o.etaOut || "-")}</td>
              <td>${esc(o.signedTime || "-")}</td>
              <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis">${esc(o.remark || "-")}</td>
              <td>${esc(o.trackingNo || "-")}</td>
              <td>
                <a href="javascript:void(0)" style="color:#2e7d32" onclick="printLabels(fullOrders['${o.id}'])" title="打印外箱唛头（10×10cm，每箱一张）">🖨 唛头</a>
                <a href="javascript:void(0)" style="color:#e09612" onclick="showDetail('${o.id}')">📝 详情</a>
              </td>
            </tr>`
          ).join("");
        // 最新动态列：点击跳转运踪；并同步真实运踪关键词
        for (const o of orders) {
          if (!o.trackingNo) continue;
          const cell = document.getElementById("dyn_" + o.id);
          if (cell)
            cell.addEventListener("click", () => {
              location.href = "tracking.html?no=" + encodeURIComponent(o.trackingNo);
            });
        }
        syncStatusFromTracking(orders);
      } catch (e) {
        tbody.innerHTML = "";
        toast(e.message, "err");
      }
    }

    async function showDetail(id) {
      try {
        const { order: o } = await api("/api/orders/" + id);
        fullOrders[o.id] = o;
        const row = (k, v) => `<div class="field" style="margin-bottom:10px"><label style="width:96px">${k}</label><div style="flex:1">${esc(v || "-")}</div></div>`;
        // 值本身是可信 HTML（如状态徽章）时用这个，不转义
        const rowHtml = (k, v) => `<div class="field" style="margin-bottom:10px"><label style="width:96px">${k}</label><div style="flex:1">${v || "-"}</div></div>`;
        const trackHist = (o.history || [])
          .map((h) => `<li><div class="t-time">${esc(h.time)} · ${esc(h.by)}</div><div class="t-status">${esc(h.status)}</div></li>`)
          .join("");
        const atts = [
          ...(o.attachments || []),
          ...(o.attachmentKey ? [{ key: o.attachmentKey, name: o.attachmentName || "附件" }] : []),
        ];
        const attHtml = atts.length
          ? atts
              .map(
                (a) =>
                  `<a style="color:#2e7d32;margin-right:12px" href="${fileUrl(a.key)}" target="_blank">${esc(a.name)}${
                    a.size ? `<span style="color:#9ca3af">(${fmtSize(a.size)})</span>` : ""
                  }</a>`
              )
              .join("")
          : "未上传";
        document.getElementById("detailBox").innerHTML = `
          <h3>订单详情 · <span style="color:#2e7d32">${esc(o.orderNo || o.asn || "-")}</span>（${esc(channelName(o.channel))}）</h3>
          <div class="form-grid">
            ${row("唛头", o.markingNo || "-")}
            ${rowHtml("状态", statusPill(o.status))}
            ${rowHtml("入库日期", `<span id="dInbound">${esc(o.createdAt)}</span>`)}
            ${row("交货仓库", o.warehouse)}
            ${row("箱数/件数", o.pieces)}
            ${row("重量(KG)", o.weightKg)}
            ${row("体积(CBM)", o.volumeCbm)}
            ${row("计费重", o.chargeWeight)}
            ${row("计费体积", o.chargeVolume)}
            ${row("单价", o.unitPrice ? "￥" + o.unitPrice : "")}
            ${row("计费重", o.chargeWeight)}
            ${o.deliveryFeeUnit ? row("派送费", `￥${o.deliveryFeeUnit} × ${o.deliveryFeeQty || 0} = ￥${Math.round(o.deliveryFeeUnit * (o.deliveryFeeQty || 0) * 100) / 100}`) : ""}
            ${row("总金额", o.totalAmount ? "￥" + o.totalAmount : "")}
            ${row("是否报关", o.customs)}
            ${row("货物性质", o.goodsType)}
            ${row("派送方式", o.deliveryMode)}
            ${row("派送城市", o.deliveryCity)}
            ${row("派送类型", o.deliveryType)}
            ${row("派送地址", o.deliveryAddress)}
            ${row("短地址", o.shortAddress)}
            ${row("Amazon Reference (PO-Nr)", o.amazonRef)}
            ${row("Amazon W/H（FBA仓库号）", o.amazonWh)}
            ${o.deliveryMode === "亚马逊" && Array.isArray(o.fbaRows) && o.fbaRows.length
              ? `<div class="field" style="margin-bottom:10px"><label style="width:96px">FBA 箱唛</label><div style="flex:1">${o.fbaRows
                  .map(
                    (r) =>
                      `${esc(r.fbaNo)}（${esc(r.boxes)} 箱）${
                        r.fileKey
                          ? ` · <a style="color:#2e7d32" href="${fileUrl(r.fileKey)}" target="_blank">${esc(r.fileName || "箱唛文件")}</a>`
                          : ""
                      }`
                  )
                  .join("<br />")}</div></div>`
              : ""}
            ${row("预计出仓", o.etaOut)}
            ${row("签收时间", o.signedTime)}
            ${row("签收备注", o.signedNote)}
            ${row("物流单号", o.trackingNo)}
            ${row("备注", o.remark)}
            ${row("发货人", o.senderName + (o.senderPhone ? " / " + o.senderPhone : ""))}
            ${row("发货地址", o.senderAddress)}
            ${o.podKey
              ? `<div class="field" style="margin-bottom:10px"><label style="width:96px">签收凭证</label><div style="flex:1"><a style="color:#2e7d32" href="${fileUrl(o.podKey)}" target="_blank">${esc(o.podName || "查看签收凭证")}</a></div></div>`
              : ""}
            <div class="field" style="margin-bottom:10px"><label style="width:96px">附件</label><div style="flex:1">${attHtml}</div></div>
          </div>
          <h3 style="margin-top:18px">物流动态</h3>
          <ul class="timeline" id="dTracks">${trackHist || "<li><div class='t-status'>暂无动态</div></li>"}</ul>
          <div class="modal-foot">
            <button class="btn orange" onclick="printLabels(fullOrders['${o.id}'])">🖨 打印唛头（10×10cm）</button>
            ${o.trackingNo ? `<button class="btn ghost" onclick="location.href='tracking.html?no=${encodeURIComponent(o.trackingNo)}'">🔍 查运踪</button>` : ""}
            <button class="btn" onclick="document.getElementById('detailMask').style.display='none'">关 闭</button>
          </div>`;
        document.getElementById("detailMask").style.display = "flex";
        // —— 有物流单号时，实时抓取实际运踪：替换物流动态 + 校正入库日期 ——
        if (o.trackingNo) syncDetailTracking(o.trackingNo);
      } catch (e) {
        toast(e.message, "err");
      }
    }

    /** 打开详情时实时抓真实运踪：物流动态显示实际轨迹，入库日期按运踪中的入库/到仓事件同步 */
    async function syncDetailTracking(trackingNo) {
      const box = document.getElementById("dTracks");
      const inboundEl = document.getElementById("dInbound");
      if (!box) return;
      try {
        const resp = await fetch(`${CFG.TRACK_API}/?source=auto&trackingNo=${encodeURIComponent(trackingNo)}`);
        const data = await resp.json();
        const tracks = data.tracks || [];
        if (tracks.length) {
          box.innerHTML = `<li><div class="t-time">${esc(data.currentActivity || "")} · 实时运踪</div></li>` +
            tracks
              .map(
                (t) =>
                  `<li><div class="t-time">${esc(t.time || "")}</div><div class="t-status">${esc(t.status || "")}${
                    t.statusEn && t.statusEn !== t.status ? ` <span style="color:#9ca3af;font-size:12px">${esc(t.statusEn)}</span>` : ""
                  }</div></li>`
              )
              .join("");
        }
        // 入库日期：在运踪里找 入库/到仓/收货 类事件的时间，找到则替换显示
        if (inboundEl) {
          const inTrack = tracks.find((t) =>
            /入库|到仓|进仓|收货|已签收入仓|warehouse\s*(receiving|received|inbound)|arrived\s*(at|in)\s*(the\s*)?warehouse|received\s*goods/i.test(
              `${t.status || ""} ${t.statusEn || ""}`
            )
          );
          if (inTrack && inTrack.time) {
            const d = String(inTrack.time).trim();
            inboundEl.textContent = /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(0, 10) : d;
          }
        }
      } catch (e) {
        /* 抓取失败保留原物流动态，不打断弹窗 */
      }
    }

    document.getElementById("detailMask").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) e.currentTarget.style.display = "none";
    });

    loadOrders();
  </script>
</body>
</html>
