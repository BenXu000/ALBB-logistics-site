<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新建订单 · ALBB 客户下单系统</title>
  <link rel="stylesheet" href="css/style.css?v=1006" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar" id="topbar"></div>
      <div class="content">
        <div class="card" id="proxyCard" style="display:none">
          <h3>代客下单（管理员）</h3>
          <div class="field">
            <label class="req">客户代码</label>
            <input id="proxyCode" list="custList" placeholder="输入客户代码，例如 ALBB20261004" style="text-transform: uppercase" />
            <datalist id="custList"></datalist>
          </div>
          <div class="hint" style="margin-left: 98px">
            订单将归属到该客户名下（客户登录后可看到这笔订单与唛头）。客户代码可直接输入或从下拉中选择。
          </div>
        </div>

        <div class="card">
          <h3>订单信息</h3>
          <div class="form-grid">
            <div class="field">
              <label class="req">发货渠道</label>
              <select id="channel">
                <option value="saudi-air">沙特空运</option>
                <option value="saudi-sea">沙特海运</option>
                <option value="uae-air">阿联酋空运</option>
                <option value="uae-sea">阿联酋海运</option>
              </select>
            </div>
            <div class="field">
              <label class="req">总件数</label>
              <input id="pieces" type="number" min="1" placeholder="例如：5" />
            </div>
            <div class="field">
              <label class="req">交货仓库</label>
              <select id="warehouse">
                <option value="">请选择</option>
                <option>东莞仓库</option>
                <option>佛山仓库</option>
                <option>义乌仓库</option>
                <option>广州仓库</option>
              </select>
            </div>
            <div class="field">
              <label class="req">货物性质</label>
              <select id="goodsType">
                <option value="">请选择</option>
                <option>普货</option>
                <option>普货带电</option>
                <option>敏感货（含牌/含磁/膏体等）</option>
                <option>大货/柜货</option>
              </select>
            </div>
            <div class="field">
              <label class="req">运输方式</label>
              <select id="transportMode" disabled>
                <option value="">—</option>
              </select>
            </div>
            <div class="field">
              <label class="req">是否报关</label>
              <select id="customs">
                <option value="否">不报关（双清包税）</option>
                <option value="是">需要报关退税</option>
              </select>
            </div>
            <div class="field" style="grid-column: 1 / -1">
              <label>备注（选填）</label>
              <input id="remark" placeholder="货物备注、特殊要求等" />
            </div>
          </div>
        </div>

        <div class="card">
          <h3>派送信息</h3>
          <div class="form-grid">
            <div class="field">
              <label class="req">派送方式</label>
              <select id="deliveryMode">
                <option value="">请选择</option>
                <option>亚马逊</option>
                <option>Noon预约送仓</option>
                <option>非平台仓</option>
              </select>
            </div>
            <div class="field">
              <label class="req">派送城市</label>
              <input id="deliveryCity" list="cityList" placeholder="请选择或输入城市" />
              <datalist id="cityList">
                <option>利雅得</option><option>吉达</option><option>达曼</option>
                <option>迪拜</option><option>阿布扎比</option><option>沙迦</option>
              </datalist>
            </div>
            <div class="field">
              <label class="req">派送类型</label>
              <select id="deliveryType">
                <option value="">请选择</option>
                <option>直接派送</option>
                <option>等通知派送</option>
              </select>
            </div>
            <div class="field" id="fieldFbaWh" style="display:none">
              <label class="req">Amazon W/H（FBA仓库号）</label>
              <input id="amazonWh" placeholder="例如：LAX9" />
            </div>
            <div class="field" id="fieldFbaRef" style="display:none">
              <label class="req">Amazon Reference (PO-Nr)（亚马逊参考号ID）*PO LIST</label>
              <input id="amazonRef" placeholder="亚马逊参考号 ID" />
            </div>
            <div class="field" id="fieldDeliveryAddr" style="display:none; grid-column: 1 / -1">
              <label class="req">派送地址</label>
              <textarea id="deliveryAddress" rows="2" placeholder="详细地址 + 联系人 + 联系方式"></textarea>
            </div>
            <div class="field" id="fieldShortAddr" style="display:none">
              <label class="req">短地址</label>
              <input id="shortAddress" placeholder="短地址" />
            </div>
          </div>
          <!-- 亚马逊：FBA 箱唛行 -->
          <div id="fbaSection" style="display:none; margin-top: 14px">
            <p style="font-size: 13px; font-weight: 600; color: #1e4620; margin-bottom: 8px">FBA 箱唛信息（每行一个 FBA，*PRO）</p>
            <div id="fbaRows"></div>
            <button type="button" class="btn ghost" id="btnAddFba" style="margin-top: 8px">＋ 增加一行</button>
          </div>
        </div>

        <div class="card">
          <h3>订仓表（Excel）</h3>
          <div class="field">
            <label>上传订仓表</label>
            <input type="file" id="packingFile" accept=".xlsx,.xls" />
          </div>
          <div class="hint" style="margin: 8px 0 12px 98px">
            只支持 Excel 格式（.xlsx / .xls，≤18MB）。产品图片请直接插入表格内、放在对应品名那一行。<br />
            还没有模板？<a href="订仓装箱单模板.xlsx" download>下载订仓装箱单模板</a>
          </div>
          <div id="fileList" style="margin-left: 98px; font-size: 12.5px; color: #6b7280; line-height: 1.9"></div>
        </div>

        <div class="card">
          <div style="display: flex; gap: 12px; justify-content: center">
            <button class="btn orange" id="btnSubmit">✔ 确 认</button>
            <button class="btn ghost" id="btnReset">⟳ 重置表单</button>
          </div>
          <p style="margin-top: 14px; font-size: 12.5px; color: #6b7280; text-align: center">
            除「备注」外均为必填项。下单后请将货物寄到对应仓库，到仓后 ALBB 会在 24 小时内入库并录入计费重。
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=1006"></script>
  <script src="js/common.js?v=1006"></script>
  <script>
    const user = requireLogin();
    // 管理员登录后即为「代客下单」模式：需先指定客户代码，订单归属该客户
    const isAdmin = !!(user && user.role === "admin");
    renderShell("new", isAdmin ? "代客下单（管理员）" : "新建订单");

    let custCodes = []; // 管理员可用客户代码列表（用于代客下单校验）
    if (isAdmin) {
      document.getElementById("proxyCard").style.display = "block";
      api("/api/users")
        .then(({ users }) => {
          custCodes = (users || []).map((u) => u.code);
          document.getElementById("custList").innerHTML = (users || [])
            .map((u) => `<option value="${esc(u.code)}">${esc(u.company || "")}${u.contact ? " · " + esc(u.contact) : ""}</option>`)
            .join("");
        })
        .catch((e) => toast("客户列表加载失败：" + e.message, "err"));
    }

    // 频道联动运输方式
    const channelSel = document.getElementById("channel");
    const modeSel = document.getElementById("transportMode");
    function syncMode() {
      const v = channelSel.value;
      modeSel.innerHTML = `<option selected>${v.endsWith("-air") ? "空运" : "海运"}</option>`;
      syncDeliveryUI(); // 沙特渠道才显示"短地址"
    }
    channelSel.addEventListener("change", syncMode);

    // ---------- 派送方式联动 ----------
    const modeSelD = document.getElementById("deliveryMode");
    const fbaSection = document.getElementById("fbaSection");
    const fieldFbaRef = document.getElementById("fieldFbaRef");
    const fieldFbaWh = document.getElementById("fieldFbaWh");
    const fieldAddr = document.getElementById("fieldDeliveryAddr");
    const fieldShort = document.getElementById("fieldShortAddr");

    function syncDeliveryUI() {
      const m = modeSelD.value;
      const isAmazon = m === "亚马逊";
      const isNonPlatform = m === "非平台仓";
      const isSaudi = channelSel.value.startsWith("saudi");
      fbaSection.style.display = isAmazon ? "block" : "none";
      fieldFbaRef.style.display = isAmazon ? "" : "none";
      fieldFbaWh.style.display = isAmazon ? "" : "none";
      fieldAddr.style.display = isNonPlatform ? "" : "none";
      fieldShort.style.display = isNonPlatform && isSaudi ? "" : "none";
    }
    modeSelD.addEventListener("change", syncDeliveryUI);

    // ---------- FBA 行（FBA# + 上传箱唛 + 箱数，可增删） ----------
    const fbaRows = document.getElementById("fbaRows");
    function addFbaRow() {
      const div = document.createElement("div");
      div.className = "fba-row";
      div.style.cssText =
        "display:grid;grid-template-columns:1.4fr 1.6fr 0.6fr 38px;gap:8px;align-items:center;margin-bottom:8px";
      div.innerHTML = `
        <input class="fba-no" placeholder="FBA Number（FBA箱唛）*PRO" />
        <input class="fba-file" type="file" accept=".pdf,.png,.jpg,.jpeg" title="上传亚马逊箱唛" />
        <input class="fba-boxes" type="number" min="1" placeholder="箱数" />
        <button type="button" class="btn ghost fba-del" style="padding:4px 8px;color:#dc2626">－</button>`;
      div.querySelector(".fba-del").addEventListener("click", () => {
        if (fbaRows.children.length > 1) div.remove();
        else toast("至少保留一行", "err");
      });
      fbaRows.appendChild(div);
    }
    document.getElementById("btnAddFba").addEventListener("click", addFbaRow);
    addFbaRow();

    // URL 预选频道：index.html?channel=saudi-sea
    const q = new URLSearchParams(location.search).get("channel");
    if (q && CHANNELS.some((c) => c.key === q)) channelSel.value = q;
    syncMode();

    // 附件选择后即时预览（含压缩预估）
    const packingInput = document.getElementById("packingFile");
    packingInput.addEventListener("change", () => {
      const files = Array.from(packingInput.files || []);
      document.getElementById("fileList").innerHTML = files.length
        ? files
            .map(
              (f) =>
                `· ${esc(f.name)} <span style="color:${isImageFile(f) ? "#16a34a" : "#6b7280"}">${fmtSize(f.size)}${
                  isImageFile(f) ? "（提交时自动压缩）" : ""
                }</span>`
            )
            .join("<br />")
        : "";
    });

    document.getElementById("btnReset").addEventListener("click", () => location.reload());

    // ---------- 必填校验：除「备注」外全部必填 ----------
    function validate() {
      if (isAdmin) {
        const c = (document.getElementById("proxyCode").value || "").trim().toUpperCase();
        if (!c) {
          toast("请填写客户代码，订单将归属该客户", "err");
          document.getElementById("proxyCode").focus();
          return false;
        }
        if (custCodes.length && !custCodes.includes(c)) {
          toast(`客户代码 ${c} 不存在，请核对后重新输入`, "err");
          document.getElementById("proxyCode").focus();
          return false;
        }
      }
      const must = [
        ["channel", "请选择发货渠道"],
        ["pieces", "请填写总件数"],
        ["warehouse", "请选择交货仓库"],
        ["goodsType", "请选择货物性质"],
        ["customs", "请选择是否报关"],
        ["deliveryMode", "请选择派送方式"],
        ["deliveryCity", "请填写派送城市"],
        ["deliveryType", "请选择派送类型"],
      ];
      for (const [id, msg] of must) {
        const el = document.getElementById(id);
        if (!el || !el.value.trim()) {
          toast(msg, "err");
          el && el.focus();
          return false;
        }
      }
      if (!Number(document.getElementById("pieces").value)) {
        toast("总件数请填写大于 0 的数字", "err");
        return false;
      }
      const m = modeSelD.value;
      if (m === "亚马逊") {
        if (!document.getElementById("amazonRef").value.trim()) {
          toast("请填写 Amazon Reference (PO-Nr)", "err");
          return false;
        }
        if (!document.getElementById("amazonWh").value.trim()) {
          toast("请填写 Amazon W/H（FBA仓库号）", "err");
          return false;
        }
        const rows = Array.from(fbaRows.querySelectorAll(".fba-row"));
        for (let i = 0; i < rows.length; i++) {
          const no = rows[i].querySelector(".fba-no").value.trim();
          const boxes = Number(rows[i].querySelector(".fba-boxes").value);
          const file = rows[i].querySelector(".fba-file").files[0];
          if (!no) { toast(`第 ${i + 1} 行：请填写 FBA Number`, "err"); return false; }
          if (!boxes || boxes < 1) { toast(`第 ${i + 1} 行：请填写箱数`, "err"); return false; }
          if (!file) { toast(`第 ${i + 1} 行：请上传亚马逊箱唛文件`, "err"); return false; }
        }
      }
      if (m === "非平台仓") {
        if (!document.getElementById("deliveryAddress").value.trim()) {
          toast("请填写派送地址（详细地址+联系人+联系方式）", "err");
          return false;
        }
        if (fieldShort.style.display !== "none" && !document.getElementById("shortAddress").value.trim()) {
          toast("请填写短地址", "err");
          return false;
        }
      }
      if (!packingInput.files || !packingInput.files.length) {
        toast("请上传订仓表（Excel）", "err");
        return false;
      }
      return true;
    }

    document.getElementById("btnSubmit").addEventListener("click", async () => {
      if (!validate()) return;
      const btn = document.getElementById("btnSubmit");
      btn.disabled = true;
      btn.textContent = "提交中…";
      try {
        let attachments = [];
        const files = packingInput.files;
        if (files && files.length) {
          attachments = await uploadFiles(files, (msg) => {
            btn.textContent = msg;
          });
        }
        // 亚马逊：上传每行箱唛文件
        let fbaRowsData = [];
        if (modeSelD.value === "亚马逊") {
          const rows = Array.from(fbaRows.querySelectorAll(".fba-row"));
          for (let i = 0; i < rows.length; i++) {
            const f = rows[i].querySelector(".fba-file").files[0];
            btn.textContent = `上传箱唛（${i + 1}/${rows.length}）…`;
            const up = await uploadOne(f);
            fbaRowsData.push({
              fbaNo: rows[i].querySelector(".fba-no").value.trim(),
              boxes: Number(rows[i].querySelector(".fba-boxes").value),
              fileKey: up.key,
              fileName: up.name,
            });
          }
        }
        const data = await api("/api/orders", {
          method: "POST",
          body: {
            // 管理员代客下单：指定归属客户；客户端下单：走自己账号
            code: isAdmin ? document.getElementById("proxyCode").value.trim().toUpperCase() : user.code,
            channel: channelSel.value,
            warehouse: document.getElementById("warehouse").value,
            customs: document.getElementById("customs").value,
            pieces: Number(document.getElementById("pieces").value),
            goodsType: document.getElementById("goodsType").value,
            remark: document.getElementById("remark").value,
            deliveryMode: modeSelD.value,
            deliveryCity: document.getElementById("deliveryCity").value,
            deliveryType: document.getElementById("deliveryType").value,
            deliveryAddress: document.getElementById("deliveryAddress").value,
            shortAddress: document.getElementById("shortAddress").value,
            amazonRef: document.getElementById("amazonRef").value,
            amazonWh: document.getElementById("amazonWh").value,
            fbaRows: fbaRowsData,
            attachments,
          },
        });
        toast(`下单成功！订单号 ${data.order.orderNo} · 唛头 ${data.order.markingNo}`, "ok");
        // 下单成功即可打印外箱唛头（10×10cm，每箱一张）
        if (confirm(
          `下单成功！\n订单号：${data.order.orderNo}\n唛头：${data.order.markingNo}\n箱数：${data.order.pieces} 件\n\n是否立即打印外箱唛头 LABEL（10×10cm，共 ${data.order.pieces} 张）？`
        )) {
          printLabels(data.order);
        }
        setTimeout(() => {
          // 管理员代客下单完成后返回后台订单管理；客户下单后回到订单列表
          location.href = isAdmin ? "admin.html" : "list.html?channel=" + data.order.channel + "&highlight=" + data.order.id;
        }, 1500);
      } catch (e) {
        toast(e.message, "err");
        btn.disabled = false;
        btn.textContent = "✔ 确 认";
      }
    });
  </script>
</body>
</html>
