<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>公司资料 · ALBB 客户下单系统</title>
  <link rel="stylesheet" href="css/style.css?v=1006" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <div class="topbar" id="topbar"></div>
      <div class="content">
        <div class="card" style="max-width: 760px">
          <h3>公司资料</h3>
          <p style="font-size: 12.5px; color: #6b7280; margin-bottom: 16px">
            以下资料由 ALBB 管理员统一维护，客户仅可查看。如需修改请联系您的 ALBB 对接人。
          </p>
          <div class="form-grid">
            <div class="field">
              <label>公司名称</label>
              <input id="company" readonly style="background:#f4f6f9" />
            </div>
            <div class="field">
              <label>公司简称</label>
              <input id="shortName" readonly style="background:#f4f6f9" />
            </div>
            <div class="field">
              <label>客户代码</label>
              <input id="code" readonly style="background:#f4f6f9" />
            </div>
            <div class="field">
              <label>联系人</label>
              <input id="contact" readonly style="background:#f4f6f9" />
            </div>
            <div class="field">
              <label>联系电话</label>
              <input id="phone" readonly style="background:#f4f6f9" />
            </div>
            <div class="field">
              <label>邮箱</label>
              <input id="email" readonly style="background:#f4f6f9" />
            </div>
            <div class="field">
              <label>微信</label>
              <input id="wechat" readonly style="background:#f4f6f9" />
            </div>
            <div class="field">
              <label>业务员</label>
              <input id="salesperson" readonly style="background:#f4f6f9" />
            </div>
            <div class="field" style="grid-column: 1 / -1">
              <label>客户地址</label>
              <input id="address" readonly style="background:#f4f6f9" />
            </div>
          </div>

          <div class="field" style="margin-top: 16px">
            <label>证件</label>
            <div style="flex: 1">
              <div class="hint" id="idFileHint">未上传</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js?v=1006"></script>
  <script src="js/common.js?v=1006"></script>
  <script>
    requireLogin();
    renderShell("profile", "公司资料");

    let idFileKey = "", idFileName = "";
    let existingIdFile = "";

    // 载入资料（只读展示）
    (async () => {
      try {
        const { profile: p } = await api("/api/profile");
        document.getElementById("company").value = p.company || "";
        document.getElementById("shortName").value = p.shortName || "";
        document.getElementById("code").value = p.code || "";
        document.getElementById("contact").value = p.contact || "";
        document.getElementById("phone").value = p.phone || "";
        document.getElementById("email").value = p.email || "";
        document.getElementById("wechat").value = p.wechat || "";
        document.getElementById("salesperson").value = p.salesperson || "";
        document.getElementById("address").value = p.address || "";
        idFileKey = p.idFileKey || "";
        idFileName = p.idFileName || "";
        if (idFileKey) {
          existingIdFile = idFileKey;
          document.getElementById("idFileHint").innerHTML =
            `已上传：<a style="color:#2e7d32" href="${fileUrl(idFileKey)}" target="_blank">查看 ${esc(idFileName)}</a>`;
        }
      } catch (e) {
        toast(e.message, "err");
      }
    })();
  </script>
</body>
</html>
